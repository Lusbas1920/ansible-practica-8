
[servidores]
ubuntu1 ansible_host=127.0.0.1 ansible_port=2221
ubuntu2 ansible_host=127.0.0.1 ansible_port=2232
ubuntu3 ansible_host=127.0.0.1 ansible_port=2223
ubuntu4 ansible_host=127.0.0.1 ansible_port=2224
ubuntu5 ansible_host=127.0.0.1 ansible_port=2225

[servidores:vars]
ansible_user=ansible
ansible_password=ansible
ansible_connection=ssh
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_become=true
ansible_become_method=sudo
ansible_python_interpreter=/usr/bin/python3
